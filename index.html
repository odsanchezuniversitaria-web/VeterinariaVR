<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VeterinariaVR · OseoVr4</title><style>
*{box-sizing:border-box}body{margin:0;background:#152e32;color:#f3faf8;font:15px/1.45 system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
[hidden]{display:none!important}button,select{font:inherit;color:#173c39;background:#f1f7f5;border:1px solid #c3d8d2;border-radius:8px;min-height:44px;padding:.45rem .75rem;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #55d7b7;outline-offset:2px}button:active{background:#c3ece0}
aside,.tray{position:fixed;z-index:2;background:#183c3bf5;border-radius:12px;box-shadow:0 3px 18px #00181738}
aside{top:max(12px,env(safe-area-inset-top));left:12px;padding:12px 16px;max-width:min(390px,calc(100vw - 24px))}progress{display:block;width:100%;margin-top:8px}
nav{position:fixed;z-index:2;bottom:max(10px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:flex-end;flex-wrap:wrap;gap:5px;max-width:calc(100vw - 20px)}#levels{max-width:190px}#xr{color:white;background:#20645a}
.tray{position:absolute;bottom:calc(100% + 6px);right:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;padding:8px;width:max-content;max-width:100%}
#stick{display:none;position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));width:82px;height:82px;border-radius:50%;border:1px solid #cfede0b8;background:#173b3ca8;touch-action:none;user-select:none;align-items:center;justify-content:center}#knob{display:block;width:34px;height:34px;border-radius:50%;border:2px solid #e2f8f0;background:#b7dfd5be;pointer-events:none}
@media(pointer:coarse){#stick{display:flex}nav{max-width:calc(100vw - 118px)}#levels{max-width:100%;flex-basis:100%}button,select{font-size:14px;padding:.4rem .6rem}}
@media(pointer:coarse) and (orientation:landscape){#levels{flex-basis:auto;max-width:170px}}
#mobileLevels{display:none}
@media(pointer:coarse) and (orientation:portrait){
  html[data-mode=screen][data-scene="0ScenaMenu"]{--menu-height:min(50dvh,94vw)}
  html[data-mode=screen][data-scene="0ScenaMenu"] #view{height:var(--menu-height)}
  html[data-mode=screen][data-scene="0ScenaMenu"] #mobileLevels{position:fixed;inset:var(--menu-height) 0 calc(68px + env(safe-area-inset-bottom));display:block;overflow:auto;padding:12px 14px 16px;background:#152e32;overscroll-behavior:contain}
  #mobileLevels h1{font-size:16px;font-weight:600;margin:0 0 10px;color:#d9efea}
  #mobileLevels .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  #mobileLevels button{text-align:left;background:#254447;color:#f2faf7;border-color:#3d6264}
  html[data-mode=screen][data-scene="0ScenaMenu"] #levels,html[data-mode=screen][data-scene="0ScenaMenu"] #stick{display:none}
}
#placementMarker{position:fixed;z-index:1;pointer-events:none;transform:translate(-50%,-100%);padding:3px 8px;margin-top:-9px;border-radius:5px;color:white;background:#17434bec;font-size:12px}
#placementMarker::after{content:'';position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:2px solid #bce8ff;border-radius:50%;width:10px;height:10px}
#placementMarker[data-near=true]{background:#176343}#placementMarker[data-near=true]::after{border-color:#8df1bf}html[data-mode=xr] #placementMarker{display:none}
html[data-mode=xr] nav,html[data-mode=xr] aside,html[data-mode=xr] #stick{display:none}
#zoomBar{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;gap:3px;padding:3px 4px 3px 10px;background:#193c3cf2;border-radius:10px;z-index:2}#zoomBar span{font-size:13px;margin-right:4px}#zoomBar button{min-width:44px;padding:.3rem}#zoomReset{font-variant-numeric:tabular-nums}html[data-mode=xr] #zoomBar{display:none}aside{z-index:3}
html[data-mode=xr] #boxing{display:none!important}
#boxing{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:2;max-width:min(420px,calc(100vw - 24px));background:#183c3bf5;color:#f3faf8;padding:12px;border:1px solid #60988c;border-radius:12px}
#boxing h2{font-size:18px;margin:0 0 5px}#boxing p{margin:0 0 8px;line-height:1.35}#boxing .score{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
#boxingPlay{min-height:44px}#status h2{font-size:16px;margin:0 0 5px}#status ul{padding-left:19px;margin:4px 0 0}#status li+li{margin-top:5px}
#rotateTools{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 53px);right:max(10px,env(safe-area-inset-right));display:flex;gap:4px;z-index:2}
#rotatePad{touch-action:none;user-select:none;cursor:grab}
#rotatePad:active{cursor:grabbing}html[data-mode=xr] #rotateTools{display:none}
#wideMode{min-width:44px}
@media(max-height:510px){#boxing{max-width:min(350px,54vw)}#boxing h2{font-size:15px}#boxing p{font-size:13px}}
</style><link rel="stylesheet" href="clinical.css?v=pantalla-1"></head><body>
<canvas id="view" tabindex="0" aria-label="Escena veterinaria interactiva"></canvas>
<aside id="status" role="status">Cargando VeterinariaVR<progress max="1" value="0"></progress></aside>
<section id="mobileLevels" aria-labelledby="activitiesTitle"><h1 id="activitiesTitle">Actividades</h1><div class="choices"></div></section>
<div id="stick" aria-label="Palanca táctil de movimiento" hidden><span id="knob"></span></div>
<div id="zoomBar" role="group" aria-label="Ampliación" hidden><span id="zoomType"></span><button id="zoomLess" aria-label="Reducir">−</button><button id="zoomReset" aria-label="Restablecer al 100 %">100 %</button><button id="zoomMore" aria-label="Ampliar">+</button></div>
<section id="clinical" aria-label="Guía de la práctica" hidden>
  <button id="clinicToggle" type="button" aria-expanded="false" aria-controls="clinicBody">Guía de práctica</button>
  <div id="clinicBody" hidden>
    <div id="labControls" hidden>
      <h2>Extendido del frotis</h2>
      <label for="slideAngle">Ángulo del extensor <output id="angleValue" for="slideAngle">25°</output></label>
      <input id="slideAngle" type="range" min="15" max="65" value="25" step="1">
      <button type="button" id="slideRail" aria-label="Arrastrar la lámina extensora" aria-describedby="labCue">
        <canvas id="smearDiagram" aria-hidden="true"></canvas>
      </button>
      <div class="clinicLine"><span id="labProgress">Recorrido 0 %</span><button id="dropButton" type="button">Depositar gota</button></div>
      <p id="labCue" role="status"></p>
    </div>
    <div id="surgeryControls" hidden>
      <h2 id="surgeryTitle"></h2>
      <dl><dt>Instrumento</dt><dd id="toolName"></dd><dt>Zona</dt><dd id="zoneName"></dd><dt>Gesto</dt><dd id="gestureName"></dd></dl>
      <p id="pointCue" role="status" hidden></p>
      <div class="clinicLine"><button id="partButton" type="button" hidden></button><button id="protocolButton" type="button" hidden></button></div>
    </div>
  </div>
</section>
<div id="guidePins" aria-hidden="true" hidden><span id="toolPin" class="guidePin" hidden>1</span><span id="sitePin" class="guidePin" hidden>2</span></div>
<section id="boxing" aria-label="Boxeo anatómico" hidden>
  <h2 id="boxingTarget">Boxeo anatómico</h2>
  <p id="boxingHint" role="status"></p>
  <div class="score"><span id="boxingClock"></span><span id="boxingScore"></span><span id="boxingRound"></span><button id="boxingPlay" type="button">Empezar</button></div>
</section>
<div id="rotateTools" hidden role="group" aria-label="Orientación de la pieza"><button id="rotatePad" type="button" aria-label="Arrastra para girar la pieza">↔ Girar</button><button id="rotateReset" type="button" aria-label="Restablecer orientación" title="Restablecer orientación">↺</button></div>
<span id="placementMarker" hidden></span><nav aria-label="Controles de la práctica">
<select id="levels" disabled aria-label="Cambiar actividad"><option>Actividades</option></select>
<button id="actions" hidden aria-expanded="false" aria-controls="tools">Acciones</button><div class="tray" id="tools" hidden></div>
<button id="help" aria-expanded="false">Ayuda</button><button id="wideMode" aria-label="Pantalla completa" title="Pantalla completa" aria-pressed="false" hidden>⛶</button><button id="xr" hidden>Entrar en VR</button></nav>
<script>
const el=id=>document.getElementById(id),view=el('view'),statusBox=el('status'),vr=el('xr'),levels=el('levels'),tools=el('tools'),actions=el('actions'),help=el('help'),stick=el('stick'),knob=el('knob');
const labels={prev:'Paso anterior',next:'Paso siguiente',equipment:'Equipo de protección',panel:'Mostrar u ocultar panel',legend:'Mostrar u ocultar leyenda',sign:'Ver indicaciones',rope:'Mover cuerda',pause:'Pausar o continuar',network:'Alternar multijugador'};
const titles=['Menú','Músculos','Boxeo','Cráneos','Sistema óseo','Ruleta','Cerebro','Reflejos del perro','Quirófano','Laboratorio clínico','Resortera','Práctica de resortera','Cirugía','Vaca','Anatomía','Laminitis','Transición','Elementos de protección'];
let player,activeFinger=null;
// Track only fingers that started on the scene. The walking pad and the HTML controls own their pointers.
const zoomBar=el('zoomBar'),zoomReset=el('zoomReset'),contacts=new Map();
let inspection='',pieceName='',anchor=null,offset={x:0,y:0},span=0,started=false,deferred=null,pinched=false;
const rotateTools=el('rotateTools'),rotatePad=el('rotatePad');
let spinPointer=null,twist=0;
function rotate(yaw,pitch,roll){
  if(canInspect() && inspection==='pieza' && pieceName)
    player.SendMessage('VeterinariaWeb','ScreenRotate',[yaw,pitch,roll].map(v=>Math.max(-180,Math.min(180,v)).toFixed(3)).join(','));
}
function fingerAngle(){
  const [a,b]=contacts.values();
  return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
}
rotatePad.onpointerdown=e=>{
  if(!canInspect() || e.button!==0 || spinPointer)return;
  e.preventDefault();rotatePad.setPointerCapture(e.pointerId);
  spinPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
};
rotatePad.onpointermove=e=>{
  if(spinPointer?.id!==e.pointerId)return;
  rotate((e.clientX-spinPointer.x)*.85,(e.clientY-spinPointer.y)*.85,0);
  spinPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
};
rotatePad.onpointerup=rotatePad.onpointercancel=rotatePad.onlostpointercapture=e=>{
  if(spinPointer?.id===e.pointerId)spinPointer=null;
};
rotatePad.onclick=e=>{if(e.detail===0)rotate(15,0,0);};
rotatePad.onkeydown=e=>{
  const arrows={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]};
  if(!arrows[e.key])return;
  e.preventDefault();rotate(...arrows[e.key],0);
};
el('rotateReset').onclick=()=>{
  if(canInspect() && pieceName)player.SendMessage('VeterinariaWeb','ScreenRotate','reset');
};
function canInspect(){return !!inspection && document.documentElement.dataset.mode==='screen' && !levels.disabled}
function finger(action,p){
  if(!p || !player)return;
  const b=view.getBoundingClientRect();
  player.SendMessage('VeterinariaWeb','ScreenFinger',action+','+((p.x-b.left)/b.width).toFixed(6)+','+(1-(p.y-b.top)/b.height).toFixed(6));
}
function zoom(factor){if(canInspect())player.SendMessage('VeterinariaWeb','ScreenZoom',factor)}
function clearFingers(cancel=true){
  clearTimeout(deferred);deferred=null;
  if(cancel && contacts.size && canInspect())finger('cancel',anchor);
  contacts.clear();anchor=null;offset={x:0,y:0};span=0;started=false;pinched=false;
}
function gap(){const [a,b]=contacts.values();return Math.max(3,Math.hypot(a.x-b.x,a.y-b.y))}
function beginSingle(p){if(!started && !pinched){started=true;finger('down',p)}}
document.addEventListener('veterinaria-inspection',({detail})=>{
  if(inspection!==detail.mode)clearFingers(false);
  inspection=detail.mode;pieceName=detail.target;
  zoomBar.hidden=!inspection || (inspection==='pieza' && !pieceName);
  rotateTools.hidden=inspection!=='pieza' || !pieceName;
  el('zoomType').textContent=inspection==='vista'?'Vista':'Pieza';
  zoomBar.dataset.target=pieceName;
  zoomBar.dataset.percent=String(detail.percent);
  zoomReset.textContent=detail.percent+' %';
  zoomReset.title=inspection==='vista'?'Restablecer la vista':'Restablecer el tamaño de la pieza';
});
el('zoomLess').onclick=()=>zoom(1/1.15);
el('zoomMore').onclick=()=>zoom(1.15);
zoomReset.onclick=()=>zoom(0);
view.addEventListener('wheel',e=>{
  if(!e.shiftKey || !canInspect() || (inspection==='pieza' && !pieceName))return;
  e.preventDefault();e.stopImmediatePropagation();
  const unit=e.deltaMode===1?16:e.deltaMode===2?view.clientHeight:1;
  const amount=(Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX)*unit;
  zoom(Math.exp(Math.max(-1,Math.min(1,-amount*.0018))));
},{capture:true,passive:false});
view.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch' || !canInspect() || contacts.size>=2)return;
  e.preventDefault();view.setPointerCapture(e.pointerId);
  const p={x:e.clientX,y:e.clientY};contacts.set(e.pointerId,p);
  if(contacts.size===1){
    anchor=p;offset={x:0,y:0};started=false;pinched=false;
    if(inspection==='vista')deferred=setTimeout(()=>beginSingle(p),150);
    else beginSingle(p);
  }else{
    clearTimeout(deferred);pinched=true;span=gap();twist=fingerAngle();finger('pinch',anchor);
  }
});
view.addEventListener('pointermove',e=>{
  if(!contacts.has(e.pointerId))return;
  const p={x:e.clientX,y:e.clientY};contacts.set(e.pointerId,p);
  if(contacts.size===2){
    const next=gap(),angle=fingerAngle();if(span>0)zoom(next/span);span=next;
    rotate(0,0,-((angle-twist+540)%360-180));twist=angle;return;
  }
  if(!started){
    if(pinched || Math.hypot(p.x-anchor.x,p.y-anchor.y)<6)return;
    clearTimeout(deferred);beginSingle(anchor);
  }
  anchor={x:p.x+offset.x,y:p.y+offset.y};finger('move',anchor);
});
function endFinger(e){
  if(!contacts.has(e.pointerId))return;
  if(e.type!=='pointerup'){clearFingers();return}
  clearTimeout(deferred);contacts.delete(e.pointerId);
  if(contacts.size){
    const p=contacts.values().next().value;
    offset={x:anchor.x-p.x,y:anchor.y-p.y};span=0;return;
  }
  if(!pinched && !started)finger('tap',anchor);
  else if(started)finger('up',anchor);
  clearFingers(false);
}
for(const event of ['pointerup','pointercancel','lostpointercapture'])view.addEventListener(event,endFinger);
window.addEventListener('blur',()=>clearFingers());
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearFingers()});

const wide=el('wideMode');
const immersiveBrowser=/OculusBrowser|Mobile VR|Quest [23]/i.test(navigator.userAgent);
let fullScreenAttempted=false;
function setWideLabel(){
  const full=!!document.fullscreenElement;
  wide.setAttribute('aria-pressed',String(full));
  wide.setAttribute('aria-label',full?'Salir de pantalla completa':'Pantalla completa');
  wide.title=wide.getAttribute('aria-label');
}
function enterWide(){
  if(document.fullscreenEnabled && !document.fullscreenElement)
    return document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
}
wide.hidden=!document.fullscreenEnabled || immersiveBrowser;
wide.onclick=()=>{
  fullScreenAttempted=true;
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else enterWide();
};
document.addEventListener('fullscreenchange',setWideLabel);
if(!wide.hidden){
  const firstGesture=e=>{
    if(!e.isTrusted || document.documentElement.dataset.mode!=='screen' || !e.target.closest('#view, #mobileLevels button'))return;
    document.removeEventListener('pointerup',firstGesture,true);
    if(!fullScreenAttempted){fullScreenAttempted=true;enterWide();}

  };
  document.addEventListener('pointerup',firstGesture,true);
}
const boxingPanel=el('boxing'),boxingButton=el('boxingPlay');
let boxingState=null;
function clearBoxing(){boxingState=null;boxingPanel.hidden=true;}
boxingButton.onclick=()=>{
  if(!boxingState || document.documentElement.dataset.mode!=='screen')return;
  const action=({inicio:'inicio',jugando:'pausa',pausa:'pausa',fin:'repetir'})[boxingState.estado];
  if(action)player.SendMessage('VeterinariaWeb','BoxeoAccion',action);
};
document.addEventListener('veterinaria-boxeo',({detail:s})=>{
  if(!s.estado || view.dataset.scene!=='4ScenaBoxeo'){clearBoxing();return;}
  boxingState=s;boxingPanel.hidden=false;
  const touch=matchMedia('(pointer:coarse)').matches;
  const how=touch?'Toca el hueso indicado.':'Haz clic en el hueso indicado.';
  el('boxingTarget').textContent=s.estado==='fin'?'Ronda terminada':s.objetivo?'Busca '+s.objetivo:'Boxeo anatómico';
  el('boxingHint').textContent=s.estado==='inicio'?how+' Encuentra todas las copias antes de que se acabe el tiempo.':
    s.estado==='cuenta'?(s.aviso||'Prepárate'):s.estado==='pausa'?'Partida en pausa':s.estado==='fin'?'Puntaje final '+s.puntos:how;
  el('boxingClock').textContent=s.segundos+' s';
  el('boxingScore').textContent=s.puntos+' pts';
  el('boxingRound').textContent=s.ronda?'Ronda '+s.ronda+(s.racha?' · Racha '+s.racha:''):'';
  boxingButton.hidden=s.estado==='cuenta';
  boxingButton.textContent=({inicio:'Empezar',jugando:'Pausar',pausa:'Continuar',fin:'Jugar otra vez'})[s.estado]||'';
});
document.addEventListener('veterinaria-scene',e=>{if(e.detail!=='4ScenaBoxeo')clearBoxing();});
function instruccionesPantalla(){
  const touch=matchMedia('(pointer:coarse)').matches;
  const rows=touch?['Toca un objeto o botón para seleccionarlo.','Mantén un dedo sobre un objeto y arrástralo.','Desliza el fondo para mirar. Usa la palanca para caminar.']:
    ['Haz clic en un objeto o botón para seleccionarlo.','Mantén el clic y arrastra para mover un objeto.','Arrastra el fondo para mirar. Camina con WASD o las flechas.'];
  if(inspection==='pieza')rows.push(touch?'Separa o junta dos dedos para cambiar el tamaño. Gíralos para rotar la pieza. También puedes arrastrar Girar.':
    'Usa Mayús + rueda para cambiar el tamaño. Arrastra Girar para rotar la pieza horizontal o verticalmente.');
  if(inspection==='vista')rows.push(touch?'Separa o junta dos dedos para ampliar o reducir la vista.':'Usa Mayús + rueda para ampliar o reducir la vista.');
  if(view.dataset.scene==='4ScenaBoxeo')rows.unshift(touch?'Pulsa Empezar y toca el hueso que indica el panel.':'Pulsa Empezar y haz clic en el hueso que indica el panel.');
  const heading=document.createElement('h2'),list=document.createElement('ul');
  heading.textContent='Controles de la práctica';
  for(const row of rows){const entry=document.createElement('li');entry.textContent=row;list.append(entry);}
  statusBox.replaceChildren(heading,list);
}
function closeActions(){tools.hidden=true;actions.setAttribute('aria-expanded','false')}
function closeHelp(){help.setAttribute('aria-expanded','false');statusBox.hidden=true}
function move(x,y){player?.SendMessage('VeterinariaWeb','SetWalk',x.toFixed(3)+','+y.toFixed(3))}
function stopStick(){if(activeFinger!==null){activeFinger=null;move(0,0)}knob.style.transform=''}
function updateStick(e){const b=stick.getBoundingClientRect(),r=b.width*.32,dx=(e.clientX-b.left-b.width/2)/r,dy=(e.clientY-b.top-b.height/2)/r,k=Math.max(1,Math.hypot(dx,dy));move(dx/k,-dy/k);knob.style.transform='translate('+dx*r/k+'px,'+dy*r/k+'px)'}
stick.onpointerdown=e=>{if(activeFinger!==null)return;e.preventDefault();activeFinger=e.pointerId;stick.setPointerCapture(e.pointerId);updateStick(e)};
stick.onpointermove=e=>{if(e.pointerId===activeFinger)updateStick(e)};
stick.onpointerup=stick.onpointercancel=stick.onlostpointercapture=e=>{if(e.pointerId===activeFinger)stopStick()};window.addEventListener('blur',stopStick);
fetch('./actividades.json').then(r=>r.json()).then(({names})=>{const titleByScene={'0ScenaMenu':0,'7ScenaMusculo':1,'4ScenaBoxeo':2,'2ScenaCraneos':3,'1ScenaOseo':4,'6ScenaTodoRuleta':5,'5ScenaCerebro':6,'10ScenaReflejoPerro':7,'Scena6.1 Quirofano':8,'7ScenaLaboratorioClinico':9,'escena resortera':10,'3ScenaResortera':11,'8ScenaCirugia':12,'11ScenaVaca':13,'13ScenaAnatomia':14,'17ScenaVacaItis':15,'EscenaPuente':16,'9ScenaElementoP':17};levels.replaceChildren(...names.map(s=>new Option(titles[titleByScene[s]]||s,s)));if(view.dataset.scene)levels.value=view.dataset.scene}).catch(()=>levels.hidden=true);
function populateActivities(){
  const choices=document.querySelector('#mobileLevels .choices');
  const buttons=Array.from(levels.options).filter(o=>o.value!=='0ScenaMenu').map(o=>{
    const b=document.createElement('button');b.textContent=o.text;
    b.onclick=()=>{if(levels.disabled)return;levels.value=o.value;levels.onchange()};
    return b;
  });
  choices.replaceChildren(...buttons);
}
new MutationObserver(populateActivities).observe(levels,{childList:true});
document.addEventListener('veterinaria-scene',e=>{view.dataset.scene=document.documentElement.dataset.scene=e.detail;levels.disabled=false;levels.value=e.detail;closeHelp();closeActions();stopStick();stick.hidden=false});
document.addEventListener('veterinaria-actions',e=>{tools.replaceChildren();for(const id of e.detail.split(',').filter(x=>labels[x])){const b=document.createElement('button');b.textContent=labels[id];b.onclick=()=>{player?.SendMessage('VeterinariaWeb','ScreenAction',id);closeActions();view.focus()};tools.append(b)}actions.hidden=!tools.childElementCount});
levels.onchange=()=>{if(!player)return;clearFingers();zoomBar.hidden=true;stopStick();closeActions();closeHelp();actions.hidden=true;stick.hidden=true;levels.disabled=true;statusBox.textContent='Abriendo '+levels.selectedOptions[0].text;statusBox.hidden=false;player.SendMessage('VeterinariaWeb','OpenLevel',levels.value)};
actions.onclick=()=>{closeHelp();tools.hidden=!tools.hidden;actions.setAttribute('aria-expanded',String(!tools.hidden))};
help.onclick=()=>{closeActions();const open=help.getAttribute('aria-expanded')!=='true';help.setAttribute('aria-expanded',String(open));statusBox.hidden=!open;if(open)instruccionesPantalla()};
