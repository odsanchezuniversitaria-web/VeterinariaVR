<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VeterinariaVR · OseoVr4</title><style>
*{box-sizing:border-box}body{margin:0;background:#102327;color:white;font:16px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}aside,nav{position:fixed;padding:10px;z-index:1}aside{top:1rem;left:1rem;background:#102327ee;border-radius:8px}nav{bottom:0;right:0;display:flex;gap:5px}button{background:#e1f8eb;color:#142c29;border:0;border-radius:6px;padding:.65rem;min-height:44px}progress{display:block;margin-top:.5rem}#aux{display:none}@media(pointer:coarse){#aux{display:inline-flex;gap:4px}}
</style></head><body><canvas id="view" tabindex="0" aria-label="Escena veterinaria interactiva"></canvas><aside id="status" role="status">Cargando VeterinariaVR<progress max="1" value="0"></progress></aside><nav><select id="levels" disabled aria-label="Cambiar actividad"><option>Actividades</option></select><span id="aux"><button data-act="SwapHand">Mano</button><button data-act="ActionA">A</button><button data-act="ActionB">B</button></span><button id="help">Controles</button><button id="xr" hidden>Entrar en VR</button></nav>
<script>
const view=document.querySelector('#view'),statusBox=document.querySelector('#status'),vr=document.querySelector('#xr');let player,helpOpen=false;
const levels=document.querySelector('#levels');
fetch('./actividades.json').then(r=>r.json()).then(({names})=>{levels.replaceChildren(...names.map(s=>new Option(s,s)));if(view.dataset.scene)levels.value=view.dataset.scene}).catch(()=>levels.hidden=true);
document.addEventListener('veterinaria-scene',e=>{view.dataset.scene=e.detail;levels.disabled=false;levels.value=e.detail;statusBox.hidden=true});
levels.onchange=()=>{if(!player)return;levels.disabled=true;statusBox.textContent='Abriendo '+levels.value;statusBox.hidden=false;player.SendMessage('VeterinariaWeb','OpenLevel',levels.value)};
document.querySelector('#help').onclick=()=>{helpOpen=!helpOpen;statusBox.hidden=!helpOpen;if(helpOpen)statusBox.textContent='PC: WASD para caminar, arrastre derecho para mirar, clic para seleccionar. Celular: mueve el pulgar desde abajo a la izquierda, arrastra para mirar y toca para seleccionar. VR: usa el gatillo y el stick izquierdo.'};
view.oncontextmenu=e=>e.preventDefault();document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>player?.SendMessage('VeterinariaWeb',b.dataset.act));
vr.onclick=()=>{if(player?.Module?.WebXR)player.Module.WebXR.toggleVR()};function fail(s){statusBox.hidden=false;statusBox.textContent=String(s)}
</script><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
createUnityInstance(view,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'OseoVr4',productName:'VeterinariaVR',productVersion:'1',devicePixelRatio:Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.25:1.5)},n=>{const p=statusBox.querySelector('progress');if(p)p.value=n}).then(async instance=>{player=instance;statusBox.hidden=true;view.focus();try{vr.hidden=!(await navigator.xr?.isSessionSupported('immersive-vr'))}catch{vr.hidden=true}}).catch(fail)
</script></body></html>
